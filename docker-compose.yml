name: tg-signer-dashboard
services:
  dashboard:
    image: ghcr.io/lwhx/tg-signers:latest
    container_name: tg-signer-dashboard
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8999:8999"
    environment:
      TZ: "Asia/Shanghai"
      # 使用 HTTPS 访问时改为 "true"。
      COOKIE_SECURE: "false"
      # 仅首次初始化生效，至少 12 位；留空则生成 data/initial-password.txt。
      ADMIN_PASSWORD: ""
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # 启动时修正 ./data 属主后降权为 UID 10001，降权后不保留任何 capability。
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
      - FOWNER
      - SETGID
      - SETUID
    stop_grace_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
